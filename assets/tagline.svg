<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="70" viewBox="0 0 1100 70" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><linearGradient id="g" x1="0" x2="1" spreadMethod="reflect"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/><animate attributeName="x1" values="0;-1;0" dur="6s" repeatCount="indefinite"/><animate attributeName="x2" values="1;0;1" dur="6s" repeatCount="indefinite"/></linearGradient></defs>
<style>text{font-family:Consolas,'SF Mono',Menlo,monospace;font-size:20px;font-weight:700}
.l{opacity:0;animation:s 12s infinite}
.l1{animation-delay:0s}.l2{animation-delay:3s}.l3{animation-delay:6s}.l4{animation-delay:9s}
@keyframes s{0%{opacity:0;transform:translateY(8px)}4%,22%{opacity:1;transform:none}26%,100%{opacity:0;transform:translateY(-8px)}}</style>
<g text-anchor="middle" fill="url(#g)">
<text class="l l1" x="550" y="42">Architecting full-stack software with Python, JavaScript &amp; Java</text>
<text class="l l2" x="550" y="42">Crafting UI/UX, graphics &amp; video content</text>
<text class="l l3" x="550" y="42">Building AI prompts &amp; automation workflows</text>
<text class="l l4" x="550" y="42">Open to collaborate — let's build something</text></g></svg>